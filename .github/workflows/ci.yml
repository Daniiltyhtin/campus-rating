name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test harness
        run: node --test "tools/test/*.test.mjs"
      - name: Check agent docs
        run: node tools/check-agent-docs.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify backend
        run: ./backend/mvnw -f backend/pom.xml verify
      - name: Check CRAP
        run: node tools/crap.mjs backend/target/site/jacoco/jacoco.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Check frontend
        run: npm --prefix frontend run check
      - name: Build frontend
        run: npm --prefix frontend run build

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: campus-rating
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: docker/setup-buildx-action@v4
      - name: Build stack images
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yml
          targets: backend,web
          load: true
          set: |
            backend.tags=campus-rating-backend:latest
            web.tags=campus-rating-web:latest
            backend.cache-from=type=gha,scope=stack-backend
            backend.cache-to=type=gha,scope=stack-backend,mode=max
            web.cache-from=type=gha,scope=stack-web
            web.cache-to=type=gha,scope=stack-web,mode=max
      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 180
      - name: Check HTTP routing
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';

          async function request(path, status, contentType) {
            const response = await fetch(`http://127.0.0.1:8080${path}`, {
              signal: AbortSignal.timeout(10000),
            });
            assert.equal(response.status, status, path);
            assert.ok(response.headers.get('content-type')?.startsWith(contentType), path);
            return response.text();
          }

          const index = await request('/', 200, 'text/html');
          assert.match(index, /<!doctype html>/i);
          const missing = JSON.parse(await request('/api/v1/does-not-exist', 404, 'application/json'));
          assert.equal(missing.status, 404);
          assert.equal(missing.path, '/api/v1/does-not-exist');
          assert.equal(await request('/actuator/health', 200, 'text/html'), index);
          await request('/assets/does-not-exist.js', 404, 'text/html');
          console.log('Stack HTTP checks passed');
          JS
      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack and remove volumes
        if: always()
        run: docker compose down -v
