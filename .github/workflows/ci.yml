name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test harness
        run: node --test "tools/test/*.test.mjs"
      - name: Check agent docs
        run: node tools/check-agent-docs.mjs

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify backend
        run: ./backend/mvnw -f backend/pom.xml verify
      - name: Check CRAP
        run: node tools/crap.mjs backend/target/site/jacoco/jacoco.xml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Lint API contract
        run: npx --no-install --prefix frontend redocly lint --config docs/spec/api/redocly.yaml docs/spec/api/openapi.yaml
      - name: Check generated API artifacts
        run: |
          npm --prefix frontend run api:gen
          git diff --exit-code -- frontend/src/api/schema.d.ts frontend/src/api/problemCodes.generated.ts frontend/src/mocks/examples.generated.ts
      - name: Check frontend
        run: npm --prefix frontend run check
      - name: Build frontend
        run: npm --prefix frontend run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: campus-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        run: npm --prefix e2e ci
      - name: Check e2e
        run: npm --prefix e2e run check
      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Remove previous e2e volumes
        run: docker compose -p campus-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v
      - name: Build e2e images
        uses: docker/bake-action@v6
        with:
          source: .
          files: |
            docker-compose.yml
            docker-compose.e2e.yml
          targets: backend,web
          load: true
          set: |
            backend.tags=campus-e2e-backend:latest
            web.tags=campus-e2e-web:latest
            backend.cache-from=type=gha,scope=stack-backend
            backend.cache-to=type=gha,scope=stack-backend,mode=max
            web.cache-from=type=gha,scope=stack-web
            web.cache-to=type=gha,scope=stack-web,mode=max
      - name: Start e2e stack
        run: docker compose -p campus-e2e -f docker-compose.yml -f docker-compose.e2e.yml up -d --no-build --wait --wait-timeout 180
      - name: Run e2e smoke
        run: npm --prefix e2e test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
      - name: Show e2e stack logs on failure
        if: failure()
        run: docker compose -p campus-e2e -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color
      - name: Stop e2e stack and remove volumes
        if: always()
        run: docker compose -p campus-e2e -f docker-compose.yml -f docker-compose.e2e.yml down -v
