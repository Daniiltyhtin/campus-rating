spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: campus-rating
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: default

campus:
  storage:
    dir: ${CAMPUS_STORAGE_DIR:/app/uploads}
  mail:
    email-verification: ${EMAIL_VERIFICATION}
  penalty:
    default-step: ${CAMPUS_PENALTY_DEFAULT_STEP:20}
    default-interval: ${CAMPUS_PENALTY_DEFAULT_INTERVAL:1m}
    poll-period: ${CAMPUS_PENALTY_POLL_PERIOD:1s}
  semester:
    accrual: ${CAMPUS_SEMESTER_ACCRUAL:200}
  budget:
    monthly-limit: ${CAMPUS_BUDGET_MONTHLY_LIMIT:1000}

server:
  tomcat:
    max-swallow-size: 12MB
