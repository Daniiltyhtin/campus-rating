  /api/v1/users/{userId}/profile:
    get:
      tags: [profile]
      operationId: getUserProfile
      summary: Профиль пользователя
      description: |
        Профиль по роли владельца (мастер-R5): студент — ФИО, группа и факультет, балансы, активные и
        завершённые задачи; преподаватель — ФИО, кафедра и факультет; администратор — ФИО и роль.
        История проводок — `GET /ledger/{userId}/entries`.

        Задача в профиле зависит от смотрящего (поле `view`):
        - `PUBLIC` — чужой профиль: название точки, дедлайн, статус и списанный штраф, без перехода;
        - `OWN` — свой профиль: плюс `assignmentId` для перехода в задачу;
        - `ADMIN` — администратор: плюс `assignmentId` для экрана «Материалы сдачи»
          (`/admin/submissions/:assignmentId`).

        Ссылка, файл и комментарий возврата в профиле не отдаются никогда — только `GET /assignments/{id}`
        с проверкой прав (мастер-R3). Строку «Пароль выставлен» добавит мастер-U13.

        Доступ: любой вошедший.
