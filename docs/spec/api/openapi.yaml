    CheckpointTitle:
      type: object
      required: [id, title]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string

    PenaltyPhase:
      type: string
      description: Состояние блока штрафа; таблица значений — в `Penalty`.
      enum: [BEFORE_DEADLINE, RUNNING, ZERO_BALANCE, CAP_REACHED, STOPPED]
    Penalty:
      type: object
      description: |
        Блок штрафа (мастер-R11, KTD8 плана U3). Считает сервер; фронт не повторяет формулу, а ведёт обратный
        отсчёт до `nextAt`. Фаза выбирается по первому подходящему условию:

        | `phase` | Условие | `nextAt` | `nextAmount` |
        |---|---|---|---|
        | `STOPPED` | состояние `SUBMITTED` или `ACCEPTED` | `null` | `null` |
        | `CAP_REACHED` | `charged ≥ cap` | `null` | `null` |
        | `BEFORE_DEADLINE` | `OPEN`, время ≤ дедлайна | дедлайн: слот 0 списывается сразу после него | `min(step, cap)` |
        | `ZERO_BALANCE` | `OPEN`, после дедлайна, АР = 0 | начало следующего слота | `0` |
        | `RUNNING` | `OPEN`, после дедлайна, АР > 0 | начало ближайшего необработанного слота | `min(step, cap − charged, АР)` |

        Ближайший необработанный слот — текущий, если планировщик его ещё не прошёл (тогда `nextAt` в
        прошлом, списание — при ближайшем проходе, мастер-AE3), иначе следующий. Слот с нулевой суммой
        тоже обработан: пополнение АР внутри него штраф за этот слот не даёт (мастер-AE4).
      required: [charged, cap, step, intervalSeconds, phase, nextAt, nextAmount]
      properties:
        charged:
          type: integer
          format: int32
          description: Уже списано по назначению; возврат не обнуляет (мастер-R12).
        cap:
          type: integer
          format: int32
          description: Стоимость точки.
        step:
          type: integer
          format: int32
        intervalSeconds:
          type: integer
          format: int32
        phase:
          $ref: '#/components/schemas/PenaltyPhase'
        nextAt:
          $ref: '#/components/schemas/NullableInstant'
        nextAmount:
          type: [integer, 'null']
          format: int32
          minimum: 0

    LinkSubmission:
      type: object
      required: [id, kind, url, submittedAt, returnComment, returnedAt, withdrawnAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          const: LINK
        url:
          type: string
          format: uri
        submittedAt:
          $ref: '#/components/schemas/Instant'
        returnComment:
          type: [string, 'null']
          description: Комментарий, с которым эту версию вернули; `null`, если не возвращали.
        returnedAt:
          $ref: '#/components/schemas/NullableInstant'
        withdrawnAt:
          $ref: '#/components/schemas/NullableInstant'
          description: Время отзыва студентом; `null`, если версия не отозвана.
    FileSubmission:
      type: object
      required: [id, kind, fileName, sizeBytes, contentType, submittedAt, returnComment, returnedAt, withdrawnAt]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        kind:
          const: FILE
        fileName:
          type: string
        sizeBytes:
          type: integer
          format: int64
        contentType:
          type: string
          description: Тип, определённый сервером по содержимому при сдаче.
        submittedAt:
          $ref: '#/components/schemas/Instant'
        returnComment:
          type: [string, 'null']
          description: Комментарий, с которым эту версию вернули; `null`, если не возвращали.
        returnedAt:
          $ref: '#/components/schemas/NullableInstant'
        withdrawnAt:
          $ref: '#/components/schemas/NullableInstant'
          description: Время отзыва студентом; `null`, если версия не отозвана.
    Submission:
      description: |
        Версия сдачи. Каждая сдача — новая версия, прежние сохраняются (мастер-R10). Файл версии —
        `GET .../submissions/{submissionId}/file`, последней — `GET .../submission/file`.
      oneOf:
        - $ref: '#/components/schemas/LinkSubmission'
        - $ref: '#/components/schemas/FileSubmission'
      discriminator:
        propertyName: kind
        mapping:
          LINK: '#/components/schemas/LinkSubmission'
          FILE: '#/components/schemas/FileSubmission'
    SubmissionKind:
      type: string
      enum: [LINK, FILE]
    SubmissionUpload:
      description: Ровно одна часть — `link` или `file`; вторая запрещена (`false`), чтобы типы фронта исключали обе сразу.
      oneOf:
        - type: object
          required: [link]
          properties:
            link:
              type: string
              format: uri
              maxLength: 2000
              description: http или https.
            file: false
        - type: object
          required: [file]
          properties:
            file:
              type: string
              format: binary
              description: До 10 МБ; pdf, docx, zip, png, jpg.
            link: false

    Assignment:
      type: object
      description: |
        Назначение целиком. Только здесь отдаются материалы сдачи и комментарий возврата — с проверкой
        прав (мастер-R3); в профиле их нет никогда.
      required: [id, checkpoint, student, group, state, status, penalty, returnComment, submission, submissions, submittedAt, acceptedAt]
      properties:
