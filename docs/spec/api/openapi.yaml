      type: string
      enum: [LINK, FILE]
    SubmissionUpload:
      description: Ровно одна часть — `link` или `file`; вторая запрещена (`false`), чтобы типы фронта исключали обе сразу.
      oneOf:
        - type: object
          required: [link]
          properties:
            link:
              type: string
              format: uri
              maxLength: 2000
              description: http или https.
            file: false
        - type: object
          required: [file]
          properties:
            file:
