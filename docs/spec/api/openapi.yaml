        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - identity
      x-roles:
        - ADMIN
      x-status: implemented
      operationId: createAdminTeacherGrant
      summary: Выдать доступ преподавателю
      description: "Мастер-R2/R24, KTD23/ADR007. Доступ: только администратор. До смены временного пароля —
        PASSWORD_CHANGE_REQUIRED. Только точные сочетания GROUP(groupId), FACULTY(facultyId),
        FACULTY_COURSE(facultyId,course), COURSE(course). Другие поля, null, неизвестные id и курс вне1…6
        —VALIDATION_FAILED с fieldErrors. Нет ограничения факультетом кафедры. Одинаковая выдача идемпотентна:
        новая201, уже существующая200 с тем жеid, без второго эффекта. До допуска TeacherScope остаётся пустым."
      security:
        - session: []
          csrf: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherGrantCreate"
            example:
              kind: FACULTY_COURSE
              facultyId: 2
              course: 1
      responses:
        "200":
          description: Идентичная выдача уже существует.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeacherGrant"
              example:
                id: 7003
                kind: FACULTY_COURSE
                faculty:
                  id: 2
                  code: ЭФ
                  name: Экономический факультет
                course: 1
        "201":
          description: Создана новая выдача.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTeacherGrant"
              example:
                id: 7003
                kind: FACULTY_COURSE
                faculty:
                  id: 2
                  code: ЭФ
                  name: Экономический факультет
                course: 1
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/teachers/{teacherId}/grants/{grantId}:
    delete:
      tags:
        - identity
      x-roles:
        - ADMIN
      x-status: implemented
      operationId: deleteAdminTeacherGrant
      summary: Снять выдачу доступа
      description: "Мастер-R2/R24, KTD23/ADR007. Доступ: только администратор. До смены временного пароля —
        PASSWORD_CHANGE_REQUIRED. Удалить только указанную выдачу этого преподавателя; grant другого teacherId
        или отсутствующая выдача —404, чужую запись не менять. Повтор после удаления —404. TeacherScope
        пересчитывается, группа может остаться доступной по кафедре или другой выдаче. Старые авторские ресурсы
        сохраняются по KTD23."
      security:
        - session: []
          csrf: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - name: grantId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "204":
          description: Выдача снята, тело отсутствует.
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/teachers/{teacherId}/accessible-groups:
    get:
      tags:
        - identity
      x-roles:
        - ADMIN
      x-status: implemented
      operationId: listAdminTeacherAccessibleGroups
      summary: Доступные группы преподавателя
      description: "Мастер-R2/R24, KTD23/ADR007. Доступ: только администратор. До смены временного пароля —
        PASSWORD_CHANGE_REQUIRED. Только серверный TeacherScope: факультет кафедры ∪ дополнительные выдачи, для
        teacherApproved=false пусто. Курс рассчитывается по году набора и текущему учебному году Europe/Moscow с
        границей1сентября, только1…6. Уникальные группы name asc/id asc. Frontend не повторяет вычисление прав;
        при снятии выдачи здесь может оставаться группа по другому основанию."
      security:
        - session: []
      parameters:
        - name: teacherId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: Результат.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyGroupList"
              example:
                items:
                  - id: 11
                    name: ИВТ-21
                    faculty:
                      id: 1
                      code: ФИТ
                      name: Факультет информационных технологий
                  - id: 12
                    name: ИВТ-22
                    faculty:
                      id: 1
                      code: ФИТ
                      name: Факультет информационных технологий
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

