  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ActivityId:
      name: activityId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Month:
      name: month
      in: query
      required: false
      description: Месяц по Europe/Moscow; по умолчанию текущий.
      schema:
        $ref: '#/components/schemas/YearMonth'
    CheckpointId:
      name: checkpointId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SubmissionId:
      name: submissionId
      in: path
      required: true
      description: Id версии сдачи из `Assignment.submissions`.
      schema:
        $ref: '#/components/schemas/Id'
    FacultyId:
      name: facultyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        Непрозрачный курсор из `nextCursor` предыдущей страницы; без него — первая страница.
        Курсор привязан к сортировке и фильтрам списка: курсор от другого фильтра или битый —
        `400 VALIDATION_FAILED` с полем `cursor`.
      schema:
        type: string
        minLength: 1
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20

  responses:
    ValidationFailed:
      description: Запрос не прошёл проверку.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            code: VALIDATION_FAILED
            detail: Проверьте поля формы.
            fieldErrors:
              - field: cursor
                code: INVALID
                message: Курсор не подходит к этому списку.
    Unauthenticated:
      description: Нет сессии или она истекла.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unauthorized
            status: 401
            code: UNAUTHENTICATED
            detail: Войдите в систему.
    Forbidden:
      description: |
        Нет прав. Какие коды возможны у конкретной операции, следует из её метода и описания:
        `PASSWORD_CHANGE_REQUIRED` не отдают `GET /auth/me`, `POST /auth/password` и `POST /auth/logout`,
        `CSRF_INVALID` — только изменяющие методы. `code`:
        - `FORBIDDEN` — роль или принадлежность ресурса не подходят;
        - `GROUP_NOT_ACCESSIBLE` — группа вне доступных преподавателю (мастер-KTD23);
        - `PASSWORD_CHANGE_REQUIRED` — сначала смените пароль (мастер-R49);
        - `CSRF_INVALID` — нет или неверен CSRF-заголовок.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: FORBIDDEN
                detail: Недостаточно прав.
            passwordChangeRequired:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: PASSWORD_CHANGE_REQUIRED
                detail: Смените временный пароль.
            csrfInvalid:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: CSRF_INVALID
                detail: Обновите страницу и повторите действие.
    GroupForbidden:
      description: |
        Нет прав, включая группу вне доступных. `code` — как у `Forbidden`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            groupNotAccessible:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: GROUP_NOT_ACCESSIBLE
                detail: Группа ИВТ-22 вне ваших доступных групп.
            forbidden:
              value:
                type: about:blank
                title: Forbidden
                status: 403
                code: FORBIDDEN
                detail: Недостаточно прав.
    CsrfForbidden:
      description: Нет или неверен CSRF-заголовок (`CSRF_INVALID`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            csrfInvalid:
              $ref: '#/components/examples/CsrfInvalid'
    NotFound:
      description: Ресурса нет или он скрыт от вызывающего.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            code: NOT_FOUND
            detail: Не найдено.
    InvalidState:
      description: Действие недопустимо в текущем состоянии ресурса.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            code: INVALID_STATE
            detail: Действие недоступно в текущем состоянии.

    EnrollmentRejected:
      description: '`ENROLLMENT_CLOSED` — время начала наступило; `MEMBERSHIP_NOT_ACTIVE` — членство ждёт подтверждения.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            closed:
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: ENROLLMENT_CLOSED
                detail: Запись закрыта — активность уже началась.
            membershipNotActive:
              value:
                type: about:blank
                title: Unprocessable Content
                status: 422
                code: MEMBERSHIP_NOT_ACTIVE
                detail: Членство в группе ждёт подтверждения.
    EnrollmentClosed:
      description: '`ENROLLMENT_CLOSED` — время начала наступило.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Unprocessable Content
            status: 422
            code: ENROLLMENT_CLOSED
            detail: Запись закрыта — активность уже началась.
    ParticipationConflict:
      description: '`ALREADY_CONFIRMED` — уровень уже подтверждён иначе; `INVALID_STATE` — активность ещё не началась.'
      content:
        application/problem+json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/StudentsProblem'
              - $ref: '#/components/schemas/InvalidStateProblem'
          examples:
            alreadyConfirmed:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: ALREADY_CONFIRMED
                detail: Участие уже подтверждено с другим уровнем.
                studentIds: [1001]
            notStarted:
              value:
                type: about:blank
                title: Conflict
                status: 409
                code: INVALID_STATE
                detail: Подтверждать участие можно после начала активности.
    ParticipantsRejected:
      description: '`NOT_ENROLLED` или `STUDENT_NOT_ELIGIBLE` со `studentIds`; ничего не изменено.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StudentsProblem'
          examples:
            notEnrolled:
              $ref: '#/components/examples/NotEnrolled'
            notEligible:
              $ref: '#/components/examples/StudentNotEligible'

  schemas:
    Id:
      type: integer
      format: int64
      minimum: 1

    ProblemCode:
      type: string
      description: |
        Закрытый перечень кодов ошибок; новый код — только правкой контракта.

        | Код | HTTP | Когда |
        |---|---|---|
        | `UNAUTHENTICATED` | 401 | нет сессии |
        | `INVALID_CREDENTIALS` | 401 | неверная пара email и пароль, в том числе неизвестный email |
        | `FORBIDDEN` | 403 | роль или принадлежность ресурса |
        | `GROUP_NOT_ACCESSIBLE` | 403 | группа вне доступных преподавателю |
        | `PASSWORD_CHANGE_REQUIRED` | 403 | до смены временного пароля |
        | `EMAIL_NOT_VERIFIED` | 403 | вход до подтверждения email (с мастер-U15), только после верного пароля |
        | `CSRF_INVALID` | 403 | нет или неверен CSRF-заголовок |
        | `NOT_FOUND` | 404 | ресурса нет |
        | `INVALID_STATE` | 409 | недопустимый переход состояния |
        | `EMAIL_TAKEN` | 409 | email уже зарегистрирован |
        | `EMAIL_RESERVED_FOR_TEACHER` | 409 | email из списка преподавателей регистрируется студентом |
        | `ALREADY_CONFIRMED` | 409 | участие уже подтверждено с другим уровнем |
        | `VALIDATION_FAILED` | 400 | тело или параметры не прошли проверку |
        | `PASSWORD_REUSED` | 400 | новый пароль совпадает с текущим |
        | `FILE_TOO_LARGE` | 413 | файл сдачи больше 10 МБ |
        | `FILE_TYPE_NOT_ALLOWED` | 415 | тип файла сдачи вне белого списка |
        | `BUDGET_EXCEEDED` | 422 | подтверждение превышает остаток бюджета хотя бы одной группы |
        | `NOT_ENROLLED` | 422 | студент не записан на `SOCIAL`-активность |
        | `STUDENT_NOT_ELIGIBLE` | 422 | студент вне целевых групп или с `PENDING`-членством |
        | `MEMBERSHIP_NOT_ACTIVE` | 422 | действие студента требует `ACTIVE`-членства |
        | `ENROLLMENT_CLOSED` | 422 | запись или отмена после времени начала активности |
        | `INTERNAL_ERROR` | 500 | непредвиденная ошибка сервера; подробности только в логе backend |
      enum:
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - GROUP_NOT_ACCESSIBLE
        - PASSWORD_CHANGE_REQUIRED
        - EMAIL_NOT_VERIFIED
        - CSRF_INVALID
        - NOT_FOUND
        - INVALID_STATE
        - EMAIL_TAKEN
        - EMAIL_RESERVED_FOR_TEACHER
        - ALREADY_CONFIRMED
        - VALIDATION_FAILED
        - PASSWORD_REUSED
        - FILE_TOO_LARGE
        - FILE_TYPE_NOT_ALLOWED
        - BUDGET_EXCEEDED
        - NOT_ENROLLED
        - STUDENT_NOT_ELIGIBLE
        - MEMBERSHIP_NOT_ACTIVE
        - ENROLLMENT_CLOSED
        - INTERNAL_ERROR

    Problem:
      type: object
      description: Ошибка по RFC 9457 (`ProblemDetail` Spring) с доменным `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          description: '`about:blank`, пока у кодов нет собственных URI.'
          examples: [about:blank]
        title:
          type: string
          description: Стандартная фраза HTTP-статуса.
        status:
          type: integer
          format: int32
        detail:
          type: [string, 'null']
          description: Текст для пользователя на русском.
        instance:
          type: [string, 'null']
          description: Путь запроса.
        code:
          $ref: '#/components/schemas/ProblemCode'

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Имя поля тела или параметра; для вложенных — через точку и индекс (`items[0].level`).
        code:
          type: string
          description: Машинный код нарушения (`REQUIRED`, `TOO_SHORT`, `TOO_LONG`, `INVALID`, `MISMATCH`).
        message:
          type: string
          description: Текст для пользователя у поля.

    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, fieldErrors]
          properties:
            code:
              const: VALIDATION_FAILED
            fieldErrors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldError'

    BudgetCheck:
      type: object
      description: Бюджет одной группы под запрос (экран «нужно, остаток, не хватает»).
      required: [groupId, groupName, needed, remaining, shortfall]
      properties:
        groupId:
          $ref: '#/components/schemas/Id'
        groupName:
          type: string
        needed:
          type: integer
          description: Сколько требует подтверждение по новым студентам группы.
        remaining:
          type: integer
          description: Остаток бюджета группы за текущий месяц.
        shortfall:
          type: integer
          minimum: 0
          description: '`max(0, needed − remaining)`; в `BudgetProblem` — только группы с `shortfall > 0`.'

    BudgetProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, budgets]
          properties:
            code:
              const: BUDGET_EXCEEDED
            budgets:
              type: array
              minItems: 1
              description: Только группы, по которым не хватает.
              items:
                $ref: '#/components/schemas/BudgetCheck'

    StudentsProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code, studentIds]
          properties:
            code:
              enum: [NOT_ENROLLED, STUDENT_NOT_ELIGIBLE, ALREADY_CONFIRMED]
            studentIds:
              type: array
              minItems: 1
              description: Студенты, из-за которых отклонён весь запрос.
              items:
                $ref: '#/components/schemas/Id'


    Currency:
      type: string
      description: '`AR` — академический рейтинг, `BUA` — баллы учебной активности, `BOA` — общественной.'
      enum: [AR, BUA, BOA]
    EntryKind:
      type: string
      enum: [INITIAL, SEMESTER_ACCRUAL, PENALTY, ACTIVITY_AWARD]
    AssignmentState:
      type: string
      description: Хранимое состояние назначения.
      enum: [OPEN, SUBMITTED, ACCEPTED]
    AssignmentStatus:
      type: string
      description: |
        Вычисляемый статус для показа (мастер-KTD7): `IN_PROGRESS` — «В процессе» (`OPEN` до дедлайна
        включительно), `OVERDUE` — «Просрочено» (`OPEN` после дедлайна), `SUBMITTED` — «Сдано на проверку»,
        `ACCEPTED` — «Принято».
      enum: [IN_PROGRESS, SUBMITTED, OVERDUE, ACCEPTED]
    ActivityType:
      type: string
      description: '`ACADEMIC` даёт БУА, `SOCIAL` даёт БОА.'
      enum: [ACADEMIC, SOCIAL]
    ParticipationLevel:
      type: integer
      format: int32
      description: Уровень участия в процентах от максимума.
      enum: [25, 50, 75, 100]
    GroupMembershipState:
      type: string
      enum: [PENDING, ACTIVE]

    UserRef:
      type: object
      description: Ссылка на пользователя для подписи и перехода в профиль.
      required: [id, fullName]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        fullName:
          type: string
          examples: [Смирнова Анна Олеговна]
    FacultyRef:
      type: object
      required: [id, code, name]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          description: Короткое имя для подписей.
          examples: [ФИТ]
        name:
          type: string
          examples: [Факультет информационных технологий]
    StudyGroupRef:
      type: object
      required: [id, name, faculty]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          examples: [ИВТ-21]
        faculty:
          $ref: '#/components/schemas/FacultyRef'
    DepartmentRef:
      type: object
      required: [id, code, name, faculty]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        code:
          type: string
          examples: [ПИ]
        name:
          type: string
          examples: [Кафедра программной инженерии]
        faculty:
          $ref: '#/components/schemas/FacultyRef'

    PasswordReusedProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [code]
          properties:
            code:
              const: PASSWORD_REUSED

    Email:
      type: string
      format: email
      maxLength: 254
      description: Сравнивается без учёта регистра.
    Password:
      type: string
      minLength: 8
      maxLength: 72
      description: От 8 символов и не больше 72 байт в UTF-8 (предел BCrypt); байты проверяет сервер.
    FullName:
      type: string
      minLength: 1
      maxLength: 200
      description: ФИО одной строкой; пробелы по краям сервер отбрасывает.

    EmailVerificationMode:
      type: string
      description: '`campus.mail.email-verification` стенда: `REQUIRED` — `required`, `OFF` — `off`.'
      enum: [REQUIRED, OFF]
    AuthConfig:
      type: object
      required: [demo, emailVerification]
      properties:
        demo:
          type: boolean
          description: Профиль `demo` — данные пересоздаются при каждом запуске (мастер-R47).
        emailVerification:
          $ref: '#/components/schemas/EmailVerificationMode'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 1
          maxLength: 1024

    CurrentStudent:
      type: object
      description: Варианты `CurrentUser` плоские, без `allOf`, чтобы линтер ловил лишние поля в примерах.
      required: [role, id, fullName, email, mustChangePassword, group, membershipState]
      properties:
        role:
          const: STUDENT
        id:
          $ref: '#/components/schemas/Id'
        fullName:
