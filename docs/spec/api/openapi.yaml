  /api/v1/auth/register/student:
    post:
      tags: [identity]
      operationId: registerStudent
      summary: Регистрация студента
      description: |
        Создаёт студента, членство в выбранной группе (`ACTIVE` до мастер-U15, затем `PENDING`) и проводку
        `INITIAL` +1000 АР (мастер-R1, R8). Сессию не создаёт: дальше — вход или подтверждение email
        (`nextStep`).

        Порядок проверок: сначала email из списка преподавателей (`EMAIL_RESERVED_FOR_TEACHER`, без учёта
        регистра), потом занятость email (`EMAIL_TAKEN`), — ответ не выдаёт, зарегистрировался ли уже
        преподаватель из списка. Группа не того факультета — `400` по полю `groupId`.

        Пароль: от 8 символов и не больше 72 байт в UTF-8 (предел BCrypt); 73 байта — `400` с кодом
        `TOO_LONG` по полю `password`.

        Доступ: все, включая гостя; нужен CSRF-заголовок.
      x-public: true
      x-status: implemented
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
            example:
              fullName: Смирнова Анна Олеговна
              email: smirnova@student.campus.test
              password: demo-student-1
              facultyId: 1
              groupId: 11
      responses:
        '201':
          description: Студент создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
              example:
                userId: 1001
                nextStep: LOGIN
        '400':
          description: Поля не прошли проверку.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                groupOfOtherFaculty:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: Проверьте поля формы.
                    fieldErrors:
                      - field: groupId
                        code: MISMATCH
                        message: Группа не принадлежит выбранному факультету.
                passwordTooLong:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: Проверьте поля формы.
                    fieldErrors:
                      - field: password
                        code: TOO_LONG
                        message: Пароль длиннее 72 байт.
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          description: Email занят или зарезервирован за преподавателем.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                reservedForTeacher:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: EMAIL_RESERVED_FOR_TEACHER
                    detail: Этот email закреплён за преподавателем. Зарегистрируйтесь как преподаватель.
                taken:
                  $ref: '#/components/examples/EmailTaken'

