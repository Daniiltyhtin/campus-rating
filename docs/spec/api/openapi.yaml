openapi: 3.1.0
info:
  title: Campus Rating API
  version: 0.1.0
  description: |
    Контракт API модулей 1–4 (профиль, академический рейтинг, баллы активности, лента наград),
    входа, регистрации и сессии. Источник правды для backend и frontend (ADR004): сначала правится
    контракт, потом код. Как читать и расширять — `docs/spec/api/README.md`; термины — `docs/spec/glossary.md`.

    Соглашения:
    - Все пути — под `/api/v1`, полностью в `paths`.
    - Идентификаторы — `int64`, баллы — целые, время — `date-time` в UTC, длительность — целые секунды.
    - Отсутствующее значение — `null` (тип `[T, "null"]`), а не пропуск поля.
    - Ошибки — `application/problem+json` со схемой `Problem` и полем `code` из закрытого перечня `ProblemCode`.
      Любая операция может ответить `500 INTERNAL_ERROR`; в операциях он не перечисляется.
    - Сессия — cookie; изменяющие запросы несут CSRF-заголовок (схемы безопасности `session` и `csrf`).
      Токен выдаёт `GET /api/v1/auth/csrf`: фронт вызывает его при старте и после входа, выхода и смены пароля.
    - Пока у пользователя `mustChangePassword`, все непубличные операции, кроме `GET /auth/me`,
      `POST /auth/password` и `POST /auth/logout`, отвечают `403 PASSWORD_CHANGE_REQUIRED` (мастер-R49).
    - `x-roles` — какие роли с сессией вызывают операцию (`AUTHENTICATED` — любая); публичная операция вместо
      него помечена `x-public: true`. Строка «Доступ:» в описании — правило принадлежности ресурса.
    - В описаниях пути сокращены без префикса `/api/v1`.
    - `x-status` — `planned` до реализации, `implemented` после; меняет юнит, реализующий операцию.
servers:
  - url: /
security:
  - session: []
tags:
  - name: settings
    description: "Настройки стенда (мастер-U13)."
  - name: identity
    description: Вход, сессия, регистрация, доступные группы (мастер-U5).
  - name: directory
    description: Справочники факультетов, групп и кафедр (мастер-U4).
  - name: checkpoint
    description: Контрольные точки, назначения, сдача (мастер-U7, U8).
  - name: activity
    description: Активности, запись, подтверждение участия, бюджет (мастер-U9).
  - name: ledger
    description: История проводок и сверка журнала (мастер-U6, U10).
  - name: profile
    description: Профиль пользователя (мастер-U10).
  - name: feed
    description: Лента наград и рейтинги групп (мастер-U11).

