  /api/v1/activities/{activityId}/participation:
    post:
      tags: [activity]
      operationId: confirmParticipation
      summary: Подтвердить участие
      description: |
        Подтверждение участников и уровней после времени начала (мастер-R19, R20) одной транзакцией по
        протоколу мастер-U9. Начисление — `round_half_up(максимум × уровень / 100)`, валюта по типу.

        Состав запроса:
        - повторы `studentId` — `400`;
        - студент, уже подтверждённый с тем же уровнем, — в `alreadyConfirmed`, бюджет не расходует,
          проводок нет: повтор запроса безопасен;
        - уже подтверждённый с другим уровнем — весь запрос `409 ALREADY_CONFIRMED` со `studentIds`;
        - студент вне целевых групп или с `PENDING`-членством — `422 STUDENT_NOT_ELIGIBLE`;
        - незаписанный на `SOCIAL` — `422 NOT_ENROLLED` (мастер-AE10); на `ACADEMIC` запись не нужна.

        Бюджет: если новые начисления превышают остаток хотя бы одной группы, — весь запрос
        `422 BUDGET_EXCEEDED` с группами, где не хватает (мастер-AE8); ничего не начислено. До времени
        начала — `409 INVALID_STATE`.

        Доступ: только автор активности, даже если её группы ему уже недоступны; бюджет — групп этой
        активности.
      x-roles: [TEACHER]
      x-status: planned
      security:
        - session: []
          csrf: []
      parameters:
        - $ref: '#/components/parameters/ActivityId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipationRequest'
            example:
              items:
                - studentId: 1001
                  level: 50
                - studentId: 1003
                  level: 100
      responses:
        '200':
          description: Начислено.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationResult'
              examples:
                confirmed:
                  value:
                    currency: BUA
                    awards:
                      - studentId: 1001
                        groupId: 11
                        level: 50
                        amount: 38
                      - studentId: 1003
                        groupId: 11
                        level: 100
                        amount: 75
                    alreadyConfirmed: []
                    total: 113
                repeated:
                  summary: Повтор того же запроса — ничего не начислено
                  value:
                    currency: BUA
                    awards: []
                    alreadyConfirmed:
                      - studentId: 1001
                        groupId: 11
                        level: 50
                        amount: 38
                      - studentId: 1003
                        groupId: 11
                        level: 100
                        amount: 75
                    total: 0
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ParticipationConflict'
        '422':
          description: Бюджет или состав участников.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BudgetProblem'
                  - $ref: '#/components/schemas/StudentsProblem'
              examples:
                budgetExceeded:
                  summary: AE8
                  value:
                    type: about:blank
                    title: Unprocessable Content
                    status: 422
                    code: BUDGET_EXCEEDED
                    detail: Не хватает бюджета группы ИВТ-21.
                    budgets:
