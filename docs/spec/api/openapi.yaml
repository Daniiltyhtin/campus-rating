openapi: 3.1.0
info:
  title: Campus Rating API
  version: 0.1.0
  description: |
    Контракт API модулей 1–4 (профиль, академический рейтинг, баллы активности, лента наград),
    входа, регистрации и сессии. Источник правды для backend и frontend (ADR004): сначала правится
    контракт, потом код. Как читать и расширять — `docs/spec/api/README.md`; термины — `docs/spec/glossary.md`.

    Соглашения:
    - Все пути — под `/api/v1`, полностью в `paths`.
    - Идентификаторы — `int64`, баллы — целые, время — `date-time` в UTC, длительность — целые секунды.
    - Отсутствующее значение — `null` (тип `[T, "null"]`), а не пропуск поля.
    - Ошибки — `application/problem+json` со схемой `Problem` и полем `code` из закрытого перечня `ProblemCode`.
      Любая операция может ответить `500 INTERNAL_ERROR`; в операциях он не перечисляется.
    - Сессия — cookie; изменяющие запросы несут CSRF-заголовок (схемы безопасности `session` и `csrf`).
      Токен выдаёт `GET /api/v1/auth/csrf`: фронт вызывает его при старте и после входа, выхода и смены пароля.
    - Пока у пользователя `mustChangePassword`, все непубличные операции, кроме `GET /auth/me`,
      `POST /auth/password` и `POST /auth/logout`, отвечают `403 PASSWORD_CHANGE_REQUIRED` (мастер-R49).
    - `x-roles` — какие роли с сессией вызывают операцию (`AUTHENTICATED` — любая); публичная операция вместо
      него помечена `x-public: true`. Строка «Доступ:» в описании — правило принадлежности ресурса.
    - В описаниях пути сокращены без префикса `/api/v1`.
    - `x-status` — `planned` до реализации, `implemented` после; меняет юнит, реализующий операцию.
servers:
  - url: /
security:
  - session: []
tags:
  - name: identity
    description: Вход, сессия, регистрация, доступные группы (мастер-U5).
  - name: directory
    description: Справочники факультетов, групп и кафедр (мастер-U4).
  - name: checkpoint
    description: Контрольные точки, назначения, сдача (мастер-U7, U8).
  - name: activity
    description: Активности, запись, подтверждение участия, бюджет (мастер-U9).
  - name: ledger
    description: История проводок и сверка журнала (мастер-U6, U10).
  - name: profile
    description: Профиль пользователя (мастер-U10).
  - name: feed
    description: Лента наград и рейтинги групп (мастер-U11).

paths:
  /api/v1/auth/csrf:
    get:
      tags: [identity]
      operationId: getCsrfToken
      summary: Выдать CSRF-токен
      description: |
        Выставляет свежий cookie `XSRF-TOKEN` (не HttpOnly). Значение cookie фронт передаёт в заголовке
        `X-XSRF-TOKEN` на `POST`, `PUT`, `PATCH`, `DELETE`. Вход, выход и смена пароля меняют токен,
        поэтому после них фронт вызывает операцию снова.

        Доступ: все, включая гостя.
      x-public: true
      x-status: implemented
      security: []
      responses:
        '204':
          description: Cookie `XSRF-TOKEN` выставлен.
          headers:
            Set-Cookie:
              description: '`XSRF-TOKEN=<токен>; Path=/; SameSite=Lax`'
              schema:
                type: string

  /api/v1/auth/config:
    get:
      tags: [identity]
      operationId: getAuthConfig
      summary: Настройки стенда для формы регистрации
      description: |
        Режим запуска и режим подтверждения email — для пометок «Демо-стенд, данные удаляются» и
        «Подтверждение email на этом стенде выключено» (мастер-R47, R48).

        Доступ: все, включая гостя.
      x-public: true
      x-status: implemented
      security: []
      responses:
        '200':
          description: Настройки стенда.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthConfig'
              example:
                demo: true
                emailVerification: OFF

  /api/v1/auth/login:
    post:
      tags: [identity]
      operationId: login
      summary: Войти
      description: |
        Создаёт сессию и отвечает тем же, что `GET /auth/me`. Вход меняет CSRF-токен: после ответа фронт
        вызывает `GET /auth/csrf`.

        Порядок проверок (защита от перечисления учётных записей): неизвестный email и неверный пароль —
        одинаковый `401 INVALID_CREDENTIALS`; `403 EMAIL_NOT_VERIFIED` (с мастер-U15) — только после верного
        пароля. При `mustChangePassword: true` вход проходит, но до смены пароля работают только операции,
        перечисленные в описании контракта.

        Цикл CSRF на стороне фронта:
        `GET /auth/csrf` → регистрация → `GET /auth/csrf` → вход → `GET /auth/csrf` → изменяющие запросы →
        выход → `GET /auth/csrf` → вход.

        Доступ: все, включая гостя; нужен CSRF-заголовок.
      x-public: true
      x-status: implemented
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: smirnova@student.campus.test
              password: demo-student-1
      responses:
        '200':
          description: Сессия создана, cookie `JSESSIONID` выставлен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                student:
                  $ref: '#/components/examples/CurrentStudent'
                mustChangePassword:
                  $ref: '#/components/examples/CurrentAdminMustChangePassword'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Неверная пара email и пароль.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                code: INVALID_CREDENTIALS
                detail: Неверный email или пароль.
        '403':
          description: '`EMAIL_NOT_VERIFIED` (только после верного пароля) или `CSRF_INVALID`.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                emailNotVerified:
                  value:
                    type: about:blank
                    title: Forbidden
                    status: 403
                    code: EMAIL_NOT_VERIFIED
                    detail: Подтвердите email по ссылке из письма.
                csrfInvalid:
                  $ref: '#/components/examples/CsrfInvalid'

  /api/v1/auth/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: Выйти
      description: |
        Завершает текущую сессию. Выход меняет CSRF-токен: после ответа фронт вызывает `GET /auth/csrf`.
        Доступен и при `mustChangePassword`.

        Доступ: любой вошедший.
      x-roles: [AUTHENTICATED]
      x-status: implemented
      security:
        - session: []
          csrf: []
      responses:
        '204':
          description: Сессия завершена, cookie `JSESSIONID` удалён.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfForbidden'

  /api/v1/auth/me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: Текущий пользователь
      description: |
        Кто вошёл, роль, флаг смены пароля, для преподавателя — кафедра и допуск, для студента — группа и
        состояние членства. По этим полям фронт показывает плашки «Заявка ждёт подтверждения
        администратора» и «Членство ждёт подтверждения» (мастер-R2, R32). Доступна и при
        `mustChangePassword`.

        Доступ: любой вошедший.
      x-roles: [AUTHENTICATED]
      x-status: implemented
      security:
        - session: []
      responses:
        '200':
          description: Текущий пользователь.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              examples:
                student:
                  $ref: '#/components/examples/CurrentStudent'
                studentPending:
                  value:
                    role: STUDENT
                    id: 1004
                    fullName: Орлов Никита Сергеевич
                    email: orlov@student.campus.test
                    mustChangePassword: false
                    group:
                      id: 11
                      name: ИВТ-21
                      faculty:
                        id: 1
                        code: ФИТ
                        name: Факультет информационных технологий
                    membershipState: PENDING
                teacher:
                  $ref: '#/components/examples/CurrentTeacher'
                teacherNotApproved:
                  value:
                    role: TEACHER
                    id: 2002
                    fullName: Волков Максим Игоревич
                    email: volkov@campus.test
                    mustChangePassword: false
                    department:
                      id: 101
                      code: ПИ
                      name: Кафедра программной инженерии
                      faculty:
                        id: 1
                        code: ФИТ
                        name: Факультет информационных технологий
                    teacherApproved: false
                adminMustChangePassword:
                  $ref: '#/components/examples/CurrentAdminMustChangePassword'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/auth/register/student:
    post:
      tags: [identity]
      operationId: registerStudent
      summary: Регистрация студента
      description: |
        Создаёт студента, членство в выбранной группе (`ACTIVE` до мастер-U15, затем `PENDING`) и проводку
        `INITIAL` +1000 АР (мастер-R1, R8). Сессию не создаёт: дальше — вход или подтверждение email
        (`nextStep`).

        Порядок проверок: сначала email из списка преподавателей (`EMAIL_RESERVED_FOR_TEACHER`, без учёта
        регистра), потом занятость email (`EMAIL_TAKEN`), — ответ не выдаёт, зарегистрировался ли уже
        преподаватель из списка. Группа не того факультета — `400` по полю `groupId`.

        Пароль: от 8 символов и не больше 72 байт в UTF-8 (предел BCrypt); 73 байта — `400` с кодом
        `TOO_LONG` по полю `password`.

        Доступ: все, включая гостя; нужен CSRF-заголовок.
      x-public: true
      x-status: implemented
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentRegistration'
            example:
              fullName: Смирнова Анна Олеговна
              email: smirnova@student.campus.test
              password: demo-student-1
              facultyId: 1
              groupId: 11
      responses:
        '201':
          description: Студент создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
              example:
                userId: 1001
                nextStep: LOGIN
        '400':
          description: Поля не прошли проверку.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
              examples:
                groupOfOtherFaculty:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: Проверьте поля формы.
                    fieldErrors:
                      - field: groupId
                        code: MISMATCH
                        message: Группа не принадлежит выбранному факультету.
                passwordTooLong:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: Проверьте поля формы.
                    fieldErrors:
                      - field: password
                        code: TOO_LONG
                        message: Пароль длиннее 72 байт.
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          description: Email занят или зарезервирован за преподавателем.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                reservedForTeacher:
                  value:
                    type: about:blank
                    title: Conflict
                    status: 409
                    code: EMAIL_RESERVED_FOR_TEACHER
                    detail: Этот email закреплён за преподавателем. Зарегистрируйтесь как преподаватель.
                taken:
                  $ref: '#/components/examples/EmailTaken'

  /api/v1/auth/register/teacher:
    post:
      tags: [identity]
      operationId: registerTeacher
      summary: Регистрация преподавателя
      description: |
        Создаёт преподавателя с выбранной кафедрой без допуска (мастер-R2, ADR007): вход работает, доступных
        групп нет, `GET /auth/me` отдаёт `teacherApproved: false`. Допуск ставит администратор (мастер-U13)
        или подтверждение email из списка преподавателей при `required` (мастер-U15); тогда кафедра берётся
        из записи списка. Проводок нет. Сессию не создаёт.

        Пароль — как у регистрации студента.

        Доступ: все, включая гостя; нужен CSRF-заголовок.
      x-public: true
      x-status: implemented
      security:
        - csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherRegistration'
            example:
              fullName: Волков Максим Игоревич
              email: volkov@campus.test
              password: teacher-pass-1
              departmentId: 101
      responses:
        '201':
          description: Преподаватель создан, ждёт допуска.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResult'
              examples:
                emailVerificationOff:
                  value:
                    userId: 2002
                    nextStep: LOGIN
                emailVerificationRequired:
                  value:
                    userId: 2002
                    nextStep: CONFIRM_EMAIL
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '403':
          $ref: '#/components/responses/CsrfForbidden'
        '409':
          description: Email занят.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                taken:
                  $ref: '#/components/examples/EmailTaken'

  /api/v1/auth/password:
    post:
      tags: [identity]
      operationId: changePassword
      summary: Сменить пароль
      description: |
        Меняет пароль, снимает `mustChangePassword` и завершает все остальные сессии пользователя; текущая
        сессия остаётся (мастер-R49, R50). Токен CSRF меняется: после ответа фронт вызывает `GET /auth/csrf`.
        Новый пароль — по правилам регистрации и не равен текущему (`PASSWORD_REUSED`); неверный текущий —
        `400` с кодом `MISMATCH` по полю `currentPassword`.

        Доступ: любой вошедший, в том числе с `mustChangePassword`.
      x-roles: [AUTHENTICATED]
      x-status: implemented
      security:
        - session: []
          csrf: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
            example:
              currentPassword: Tmp-8kQ2-vX7p
              newPassword: my-new-password-1
      responses:
        '204':
          description: Пароль сменён.
        '400':
          description: Пароль не прошёл проверку или совпадает с текущим.
          content:
            application/problem+json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationProblem'
                  - $ref: '#/components/schemas/PasswordReusedProblem'
              examples:
                wrongCurrent:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    code: VALIDATION_FAILED
                    detail: Проверьте поля формы.
                    fieldErrors:
                      - field: currentPassword
                        code: MISMATCH
                        message: Текущий пароль указан неверно.
                reused:
                  value:
                    type: about:blank
                    title: Bad Request
                    status: 400
                    code: PASSWORD_REUSED
                    detail: Новый пароль должен отличаться от текущего.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfForbidden'

  /api/v1/me/accessible-groups:
    get:
      tags: [identity]
      operationId: listAccessibleGroups
      summary: Доступные группы преподавателя
      description: |
        Группы факультета кафедры плюс группы выдач доступа (мастер-R3, KTD23) — для форм точек и
        активностей и экрана «Группы». У преподавателя без допуска — пустой список. Отсортированы по
        факультету и названию.

        Доступ: преподаватель, только свои.
      x-roles: [TEACHER]
      x-status: implemented
      security:
        - session: []
      responses:
        '200':
          description: Доступные группы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupList'
              examples:
                approved:
                  value:
                    items:
                      - id: 11
                        name: ИВТ-21
                        faculty:
                          id: 1
                          code: ФИТ
                          name: Факультет информационных технологий
                      - id: 12
                        name: ИВТ-22
                        faculty:
                          id: 1
                          code: ФИТ
                          name: Факультет информационных технологий
                notApproved:
                  value:
                    items: []
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/directory/faculties:
    get:
      tags: [directory]
      operationId: listFaculties
      summary: Факультеты
      description: |
        Для формы регистрации; по названию.

        Доступ: все, включая гостя.
      x-public: true
      x-status: implemented
      security: []
      responses:
        '200':
          description: Факультеты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacultyList'
              example:
                items:
                  - id: 1
                    code: ФИТ
                    name: Факультет информационных технологий
                  - id: 2
                    code: ЭФ
                    name: Экономический факультет

  /api/v1/directory/faculties/{facultyId}/groups:
    get:
      tags: [directory]
      operationId: listFacultyGroups
      summary: Группы факультета
      description: |
        Только группы этого факультета, по названию (мастер-R1).

        Доступ: все, включая гостя.
      x-public: true
      x-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/FacultyId'
      responses:
        '200':
          description: Группы факультета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupList'
              example:
                items:
                  - id: 11
                    name: ИВТ-21
                    faculty:
                      id: 1
                      code: ФИТ
                      name: Факультет информационных технологий
                  - id: 12
                    name: ИВТ-22
                    faculty:
                      id: 1
                      code: ФИТ
                      name: Факультет информационных технологий
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/directory/faculties/{facultyId}/departments:
    get:
      tags: [directory]
      operationId: listFacultyDepartments
      summary: Кафедры факультета
      description: |
        Для формы регистрации преподавателя; по названию.

        Доступ: все, включая гостя.
      x-public: true
      x-status: implemented
      security: []
      parameters:
        - $ref: '#/components/parameters/FacultyId'
      responses:
        '200':
          description: Кафедры факультета.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentList'
              example:
                items:
                  - id: 101
                    code: ПИ
                    name: Кафедра программной инженерии
                    faculty:
                      id: 1
                      code: ФИТ
                      name: Факультет информационных технологий
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/checkpoints:
    get:
      tags: [checkpoint]
      operationId: listMyCheckpoints
      summary: Мои контрольные точки
      description: |
        Точки текущего преподавателя со счётчиками для экранов «Мои точки» и «Главная» (мастер-R14).
        Сначала ближайший дедлайн в будущем, затем прошедшие, от недавних. Список целиком: точек у
        преподавателя за семестр десятки.

        Доступ: преподаватель, только свои точки — в том числе для групп, которые уже недоступны.
      x-roles: [TEACHER]
      x-status: implemented
      security:
        - session: []
      responses:
        '200':
          description: Точки преподавателя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckpointList'
              example:
                items:
                  - id: 501
                    title: Лабораторная 3. Деревья поиска
                    description: Реализовать АВЛ-дерево, покрыть тестами вставку и удаление, приложить отчёт.
                    deadline: '2026-11-12T09:00:00Z'
                    cost: 60
                    penaltyStep: 20
                    penaltyIntervalSeconds: 60
                    groups:
                      - id: 11
                        name: ИВТ-21
                        faculty:
                          id: 1
                          code: ФИТ
                          name: Факультет информационных технологий
                      - id: 12
                        name: ИВТ-22
                        faculty:
                          id: 1
