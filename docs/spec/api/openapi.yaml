        penalty:
          $ref: '#/components/schemas/Penalty'
        returnComment:
          type: [string, 'null']
          description: |
            Комментарий последнего возврата, пока работа на доработке (`OPEN` после возврата); после новой
            сдачи — `null`. Комментарии всех возвратов остаются у версий в `submissions`.
        submission:
          description: Последняя версия сдачи; после возврата остаётся до новой сдачи.
          anyOf:
            - $ref: '#/components/schemas/Submission'
