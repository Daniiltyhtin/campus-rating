<body data-view="both">
<header class="mast"><div><div class="eyebrow">Campus Rating / U21b / Визуальное исследование</div><h1>Два характера. Один интерфейс.</h1><p>Сравните типографику, состояния и плотность на одинаковых данных. Телефоны — 360 px; таблицы преподавателя — ниже.</p></div><div class="view-switch" role="group" aria-label="Показать варианты"><button data-view="both" aria-pressed="true">Рядом</button><button data-view="c" aria-pressed="false">Только C</button><button data-view="d" aria-pressed="false">Только D</button></div></header>

<template id="t-tokens">
<div class="ui tokens">
  <div class="card stack">
    <h3>Цвета</h3>

  </div>
  <div class="card stack">
    <h3>Шрифты</h3>
    <div class="type-scale">
      <div><span class="tag">Заголовок 20</span><h1>Лабораторная 3. Деревья поиска</h1></div>
      <div><span class="tag">Подзаголовок 16</span><h2>История проводок</h2></div>
      <div><span class="tag">Текст 14</span><span>Реализовать АВЛ-дерево, покрыть тестами вставку и удаление, приложить отчёт.</span></div>
      <div><span class="tag">Подпись 12.5</span><span class="small muted">Петров П. П. · Алгоритмы · ИВТ-21</span></div>
      <div><span class="tag">Баллы</span><span class="num" style="font-size:24px">940 · 120 · 50 · −20 · +125</span></div>
    </div>
  </div>
  <div class="card"><dl class="facts" data-facts></dl></div>
</div>
</template>

  <div class="card stack">
    <div class="row wrap">
      <button class="btn btn-primary" type="button">Сдать работу</button>
      <button class="btn btn-default" type="button">Отмена</button>
      <button class="btn btn-subtle" type="button">Показать ещё</button>
      <button class="btn btn-danger" type="button">Вернуть…</button>
    </div>
    <div class="row wrap">
      <button class="btn btn-primary" type="button">Принять 3 работы</button>
      <button class="btn btn-primary" type="button" disabled>Начислить 125 БОА</button>
      <button class="btn btn-primary" type="button" aria-busy="true"><span class="spinner"></span>Сохраняем…</button>
    </div>
  </div>
  <div class="card stack">
    <div class="field"><label>Ссылка на работу</label><input class="input" type="url" placeholder="https://"></div>

    <div class="stack tight">
      <span class="badge s-overdue" style="align-self:flex-start">Просрочено</span>

function heading(key){const v=variants[key];return `<header class="variant-head"><span class="variant-letter">${key.toUpperCase()}</span><div><div class="eyebrow">${v.caption}</div><h2>«${v.name}»</h2><p>${v.description}</p></div></header>`}
for(const key of Object.keys(variants)){const column=document.createElement('article');column.className='variant '+key;column.dataset.variant=key;column.innerHTML=heading(key);for(const [id,n,label] of sections){const section=document.createElement('section');section.className='spec-section';section.innerHTML=`<h3 class="section-label"><span>${n}</span>${label}</h3>`;const content=document.createElement('div');content.className=id==='tokens'?'':id==='controls'?'controls-wrap':'phones';content.append(document.getElementById('t-'+id).content.cloneNode(true));section.append(content);column.append(section)}document.getElementById('columns').append(column);const desktop=document.createElement('article');desktop.className='variant '+key;desktop.dataset.variant=key;desktop.innerHTML=heading(key)+'<div class="desk-frame" tabindex="0" role="region" aria-label="Таблица преподавателя — прокрутка по горизонтали"></div>';desktop.querySelector('.desk-frame').append(document.getElementById('t-desk').content.cloneNode(true));document.getElementById('desktops').append(desktop)}
const paths=['M3 10 12 3l9 7v10h-6v-6H9v6H3z','M6 3h12v18H6z M9 8h6 M9 12h6 M9 16h4','m12 3 2.5 6 6.5 1-5 4 1.5 7-5.5-4-5.5 4L8 14l-5-4 6.5-1z','M8 3h8v7a4 4 0 0 1-8 0z M8 5H4v3a4 4 0 0 0 4 4 M16 5h4v3a4 4 0 0 1-4 4 M12 14v6 M8 21h8','M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0 M4 21v-2a8 8 0 0 1 16 0v2'];

function hex(css){const probe=document.createElement('span');probe.style.color=css;document.body.append(probe);const rgb=getComputedStyle(probe).color.match(/\d+/g).slice(0,3);probe.remove();return '#'+rgb.map(n=>Number(n).toString(16).padStart(2,'0')).join('')}
document.querySelectorAll('[data-swatches]').forEach(el=>{const style=getComputedStyle(el);for(const item of el.dataset.swatches.split('|')){const [token,label]=item.split(':');const value=hex(style.getPropertyValue(token).trim());const swatch=document.createElement('div');swatch.className='swatch';swatch.innerHTML=`<i style="background:var(${token})" aria-hidden="true"></i><span>${label}</span><code>${value}</code>`;el.append(swatch)}});

document.querySelectorAll('[data-toast]').forEach(button=>button.addEventListener('click',()=>{const toast=button.closest('.phone').querySelector('.toast');clearTimeout(toast.timer);toast.textContent=button.dataset.toast;toast.classList.add('show');toast.timer=setTimeout(()=>toast.classList.remove('show'),4500)}));
