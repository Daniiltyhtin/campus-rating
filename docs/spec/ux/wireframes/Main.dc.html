<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карта экранов по ролям</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222}
a{color:#444}a:hover{color:#000}
</style>
</helmet>
<div style="width:1600px;height:1150px;box-sizing:border-box;padding:48px;background:#fafafa;display:flex;flex-direction:column;gap:28px">
<div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px">
<div style="display:flex;flex-direction:column;gap:6px">
<h1 style="margin:0;font-size:32px;font-weight:700">Карта экранов по ролям</h1>
<p style="margin:0;font-size:16px;color:#555">Маршрут · экран · требования спеки · приоритет. Навигация: боковая панель на десктопе, нижняя на мобильном — не больше пяти пунктов.</p>
</div>
<div style="display:flex;gap:8px;font-size:13px;color:#333">
<span style="border:1px solid #888;border-radius:4px;padding:3px 8px;background:#fff">P0 база</span>
<span style="border:1px dashed #888;border-radius:4px;padding:3px 8px;background:#fff">P1–P4 доп. модули</span>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:10px">
<h2 style="margin:0;font-size:18px">Без входа</h2>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px">
<sc-for list="{{publicScreens}}" as="s" hint-placeholder-count="3">
<div style="background:#fff;border:{{s.border}};border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:4px">
<div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:15px">{{s.name}}</strong><span style="font-size:12px;color:#555">{{s.p}}</span></div>
<code style="font-size:12px;color:#555">{{s.route}}</code>
<span style="font-size:13px;color:#444">{{s.what}}</span>
</div>
</sc-for>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;flex-grow:1;min-height:0">
<sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:10px;min-height:0">
<h2 style="margin:0;font-size:18px">{{r.title}}</h2>
<div style="display:flex;gap:4px;background:#e6e6e6;border-radius:6px;padding:6px">
<sc-for list="{{r.nav}}" as="n" hint-placeholder-count="5">
<span style="flex:1 1 0;text-align:center;font-size:12px;background:#fff;border-radius:4px;padding:6px 2px">{{n}}</span>
</sc-for>
</div>
<sc-for list="{{r.screens}}" as="s" hint-placeholder-count="6">
<div style="background:#fff;border:{{s.border}};border-radius:6px;padding:9px 12px;display:flex;flex-direction:column;gap:2px">
<div style="display:flex;justify-content:space-between;gap:8px"><strong style="font-size:14px">{{s.name}}</strong><span style="font-size:12px;color:#555;white-space:nowrap">{{s.p}}</span></div>
<code style="font-size:12px;color:#555">{{s.route}}</code>
<span style="font-size:12.5px;color:#444;line-height:1.35">{{s.what}}</span>
</div>
</sc-for>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (name, route, what, p) => ({ name, route, what, p, border: p.startsWith('P0') ? '1px solid #888' : '1px dashed #999' });
    return {
      publicScreens: [
        card('Вход', '/login', 'Email и пароль; ссылка на регистрацию', 'P0 · R3'),
        card('Регистрация', '/register', 'Переключатель «Студент / Преподаватель»; факультет → группа или кафедра. Преподаватель без допуска — «Заявка ждёт подтверждения администратора»', 'P0 · R1, R2'),
        card('Подтверждение email', '/confirm/:token', 'Успех → вход; просроченная ссылка → отправить заново', 'P2 · R31')
      ],
      roles: [
        { title: 'Студент', nav: ['Главная', 'Задачи', 'Активности', 'Награды', 'Профиль'], screens: [
          card('Главная', '/', 'Персональная лента событий; до U14 — сводка баллов и ближайшие дедлайны', 'P1 · R28, R30'),
          card('Мои задачи', '/tasks', 'Активные и завершённые; статусы «В процессе», «Сдано», «Просрочено», «Принято»; P2: «членство ждёт подтверждения»', 'P0 · R15'),
          card('Задача', '/tasks/:id', 'Дедлайн, «списано X из Y», четыре состояния штрафа; сдача ссылкой или файлом; комментарий возврата', 'P0 · R10–R12'),
          card('Активности', '/activities', 'Целевые активности с максимумом и временем начала; запись и отмена для общественных до начала', 'P0 · R17, R18'),
          card('Лента наград', '/awards', 'Кто, сколько, за что, от кого; бесконечная прокрутка', 'P0 · R23'),
          card('Профиль', '/users/:id', 'АР, БУА, БОА; история проводок; задачи. Виден всем; в чужом — задачи без материалов сдачи', 'P0 · R5, R6'),
          card('Опросы', '/polls', 'Голосование один раз; статистика после голоса', 'P2 · R33, R34'),
          card('Уведомления', '/settings', 'Включить и выключить письма', 'P3 · R37')
        ]},
        { title: 'Преподаватель', nav: ['Главная', 'Точки', 'Активности', 'Группы', 'Профиль'], screens: [
          card('Мои точки', '/checkpoints', 'Список точек; сколько сдано и ждёт проверки', 'P0 · R14'),
          card('Новая точка', '/checkpoints/new', 'Доступные группы, дедлайн, стоимость; шаг и интервал штрафа видны; ИИ-черновик описания', 'P0 · R7 · P4 R38'),
          card('Точка', '/checkpoints/:id', 'Назначения со статусами; открыть сдачу из строки; массовый приём с итогом; возврат с комментарием', 'P0 · R14'),
          card('Активности', '/activities, /activities/new', 'Мои активности; создание: тип, доступные группы, дата и время начала, максимум ≥ 2', 'P0 · R17'),
          card('Подтверждение участия', '/activities/:id/confirm', 'После начала: участники и уровни; итог и бюджет по группам; подтверждённые — только просмотр', 'P0 · R19, R20'),
          card('Группы и бюджет', '/groups', 'Доступные группы: остаток бюджета, история начислений; вход в подтверждение членств', 'P0 · R21'),
          card('Рейтинг группы', '/groups/:id', 'Сортировка по АР, БУА, БОА; вкладка аналитики', 'P0 · R22 · P2 R36'),
          card('Студенты группы', '/groups/:id/students', 'Список студентов; «Выставить временный пароль» с итогом', 'P1 · R49'),
          card('Членства и опросы', '/groups/:id/members, /polls', 'Подтверждение студентов доступной группы; детальная статистика — только своих опросов', 'P2 · R32, R33, R35')
        ]},
        { title: 'Администратор', nav: ['Справочники', 'Импорт', 'Семестры', 'Настройки', 'Старосты'], screens: [
          card('Справочники', '/admin/directory', 'Факультеты, группы, кафедры; заявки преподавателей на допуск; выдачи преподавателю: группа, факультет, курс факультета, курс на всех факультетах; нельзя удалить группу со студентами', 'P1 · R24'),
          card('Импорт', '/admin/import', 'CSV или XLSX групп, студентов и списка преподавателей; отчёт по строкам', 'P1 · R25'),
          card('Семестры', '/admin/semesters', 'Дата начала; «Начать сейчас» с подтверждением', 'P1 · R26'),
          card('Настройки', '/admin/settings', 'Шаг и интервал штрафа, N семестра, лимит бюджета; «действует на новые точки»', 'P1 · R26'),
          card('Старосты', '/admin/heads', 'Назначить и снять старосту группы', 'P1 · R27'),
          card('Сверка журнала', '/admin/ledger-check', 'Инвариант «снимок = сумма журнала»; пусто — хорошо', 'P1 · KTD3'),
          card('Материалы сдачи', '/admin/submissions/:id', 'Ссылка, файл, комментарии — только чтение', 'P1 · R24')
        ]}
      ]
    };
  }
}
</script>
</body>
</html>
