<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Активности студента</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222}
a{color:#444}a:hover{color:#000}
</style>
</helmet>
<div style="width:360px;height:800px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;border:1px solid #ccc">
<header style="height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #ddd;flex-shrink:0">
<strong style="font-size:17px">Активности</strong>
</header>
<main style="flex-grow:1;overflow:hidden;padding:16px;display:flex;flex-direction:column;gap:12px">
<div role="tablist" style="display:flex;gap:6px">
<button type="button" role="tab" aria-selected="true" style="height:36px;padding:0 12px;border:1px solid #555;border-radius:18px;background:#eee;font-size:13px;font-weight:600">Все</button>
<button type="button" role="tab" aria-selected="false" style="height:36px;padding:0 12px;border:1px solid #bbb;border-radius:18px;background:#fff;font-size:13px">Учебные · БУА</button>
<button type="button" role="tab" aria-selected="false" style="height:36px;padding:0 12px;border:1px solid #bbb;border-radius:18px;background:#fff;font-size:13px">Общественные · БОА</button>
</div>
<sc-for list="{{items}}" as="a" hint-placeholder-count="3">
<div style="border:1px solid #bbb;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px">
<div style="display:flex;justify-content:space-between;gap:8px">
<span style="font-size:12px;border:1px solid #888;border-radius:4px;padding:2px 6px">{{a.type}}</span>
<strong style="font-size:14px;white-space:nowrap">до {{a.max}}</strong>
</div>
<strong style="font-size:15px;line-height:1.3">{{a.title}}</strong>
<span style="font-size:13px;color:#555">{{a.meta}}</span>
<sc-if value="{{a.canEnroll}}" hint-placeholder-val="{{true}}">
<button type="button" style="height:44px;border:{{a.btnBorder}};border-radius:6px;background:{{a.btnBg}};color:{{a.btnColor}};font-size:14px;font-weight:600">{{a.action}}</button>
</sc-if>
<span style="font-size:12px;color:#555">{{a.hint}}</span>
</div>
</sc-for>
</main>
<nav aria-label="Основная" style="height:60px;display:flex;border-top:1px solid #ddd;flex-shrink:0">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;font-size:11px;font-weight:{{n.weight}};color:#333"><span aria-hidden="true" style="width:20px;height:20px;border-radius:4px;background:{{n.icon}}"></span>{{n.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = ['Главная', 'Задачи', 'Активности', 'Награды', 'Профиль'].map((label, i) => ({ label, weight: i === 2 ? 700 : 400, icon: i === 2 ? '#777' : '#ccc' }));
    const enroll = { canEnroll: true, action: 'Записаться', btnBorder: '0', btnBg: '#444', btnColor: '#fff' };
    const cancel = { canEnroll: true, action: 'Отменить запись', btnBorder: '1px solid #888', btnBg: '#fff', btnColor: '#222' };
    return { nav, items: [
      { type: 'Общественная · БОА', max: 50, title: 'Субботник в кампусе', meta: '09.11 · Иванова И. И. · ИВТ-21, ИВТ-22', ...enroll, hint: 'Баллы получат только записавшиеся. Запись открыта до 09.11' },
      { type: 'Общественная · БОА', max: 100, title: 'Волонтёр дня открытых дверей', meta: '15.11 · Сидоров С. С. · весь ФИТ', ...cancel, hint: 'Вы записаны. Отменить можно до 15.11' },
      { type: 'Учебная · БУА', max: 160, title: 'Олимпиада по программированию', meta: '20.11 · Петров П. П. · ИВТ-21', canEnroll: false, action: '', btnBorder: '', btnBg: '', btnColor: '', hint: 'Запись не нужна: участников отметит преподаватель' }
    ]};
  }
}
</script>
</body>
</html>
