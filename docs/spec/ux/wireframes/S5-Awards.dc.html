<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Лента наград</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222}
a{color:#444}a:hover{color:#000}
</style>
</helmet>
<div style="width:360px;height:800px;box-sizing:border-box;background:#fff;display:flex;flex-direction:column;border:1px solid #ccc">
<header style="height:52px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #ddd;flex-shrink:0">
<strong style="font-size:17px">Лента наград</strong>
</header>
<main style="flex-grow:1;overflow:hidden;padding:8px 16px;display:flex;flex-direction:column">
<div style="border:1px dashed #999;border-radius:6px;padding:8px 10px;margin:6px 0;font-size:12px;color:#444;text-align:center">Новые награды: 2 — показать (без прыжка ленты)</div>
<sc-for list="{{items}}" as="a" hint-placeholder-count="6">
<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #e5e5e5">
<div aria-hidden="true" style="width:40px;height:40px;border-radius:50%;background:#ddd;flex-shrink:0"></div>
<div style="display:flex;flex-direction:column;gap:3px;min-width:0;flex-grow:1">
<div style="display:flex;justify-content:space-between;gap:8px"><a href="S1-Profile.dc.html" style="font-size:14px;font-weight:600;text-decoration:none;color:#222">{{a.student}}</a><strong style="font-size:14px;white-space:nowrap">{{a.amount}}</strong></div>
<span style="font-size:13px;line-height:1.3">{{a.activity}}</span>
<span style="font-size:12px;color:#666">{{a.meta}}</span>
</div>
</div>
</sc-for>
<div style="display:flex;flex-direction:column;gap:6px;padding:12px 0" aria-hidden="true">
<div style="height:12px;width:70%;background:#eee;border-radius:3px"></div>
<div style="height:12px;width:45%;background:#eee;border-radius:3px"></div>
<span style="font-size:11px;color:#777">скелетон следующей страницы</span>
</div>
</main>
<nav aria-label="Основная" style="height:60px;display:flex;border-top:1px solid #ddd;flex-shrink:0">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;font-size:11px;font-weight:{{n.weight}};color:#333"><span aria-hidden="true" style="width:20px;height:20px;border-radius:4px;background:{{n.icon}}"></span>{{n.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = ['Главная', 'Задачи', 'Активности', 'Награды', 'Профиль'].map((label, i) => ({ label, weight: i === 3 ? 700 : 400, icon: i === 3 ? '#777' : '#ccc' }));
    return { nav, items: [
      { student: 'Смирнова А. О.', amount: '+50 БОА', activity: '«Помощь в организации конференции»', meta: 'от Иванова И. И. · 2 ч назад' },
      { student: 'Кузнецов Д. А.', amount: '+38 БУА', activity: '«Доклад на семинаре», 50 %', meta: 'от Петрова П. П. · 5 ч назад' },
      { student: 'Орлова Е. В.', amount: '+100 БОА', activity: '«Волонтёр дня открытых дверей»', meta: 'от Сидорова С. С. · вчера' },
      { student: 'Смирнова А. О.', amount: '+120 БУА', activity: '«Олимпиада по программированию», 75 %', meta: 'от Петрова П. П. · 30.10' },
      { student: 'Волков М. И.', amount: '+25 БОА', activity: '«Субботник в кампусе», 50 %', meta: 'от Иванова И. И. · 29.10' }
    ]};
  }
}
</script>
</body>
</html>
