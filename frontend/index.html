<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Rating</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      try {
        var appearance = JSON.parse(localStorage.getItem('campus-appearance'));
        var root = document.documentElement;
        root.dataset.theme = appearance === 'contrast' ? 'high-contrast' : appearance === 'dark' ? 'dark' : 'light';
        root.setAttribute('data-mantine-color-scheme', appearance === 'dark' ? 'dark' : 'light');
      } catch (error) {}
    </script>
    <style>html[data-theme='dark'] { background: #0f1419; color-scheme: dark; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
